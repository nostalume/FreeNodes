sources:
# Blog site with dated articles and direct subscription resources.
- kind: web
  resource_pattern: https?://clash-meta\.github\.io/uploads/\d{4}/\d{2}/[\w\-\.]+\.(?:txt|yaml|json)
  name: clashmeta
  start_url: https://clash-meta.github.io/free-nodes/
  article_exclusions: [category, page-]
# Dated blog articles with Clash and V2Ray subscription resources.
- kind: web
  resource_pattern: https://node\.nodev2ray\.com/uploads/\d{4}/\d{2}/(?:[0-9]+-)?\d{8}\.(?:txt|yaml|json)
  name: nodev2ray
  start_url: https://nodev2ray.com/free-node/
  article_exclusions: [category, page-]
# Blog with dated articles and Clash/V2Ray/sing-box resource links.
- kind: web
  resource_pattern: https://node\.freeclashnode\.com/uploads/\d{4}/\d{2}/[\d\w\.-]+
  name: freeclashnode
  start_url: https://www.freeclashnode.com/free-node/
  article_exclusions: [category, page-]
# Dated articles with Clash and V2Ray resources.
- kind: web
  resource_pattern: https://node\.clashnode\.cc/uploads/\d{4}/\d{2}/(?:\d+-\d{8}\.(?:txt|yaml)|\d{8}\.json)
  name: clashnode
  start_url: https://clashnode.cc/free-node/
  article_exclusions: [category, page-]
# Dated blog articles with direct Clash and V2Ray resources.
- kind: web
  resource_pattern: https://oss\.oneclash\.cc/\d{4}/\d{2}/\d{8}\.(?:txt|yaml)
  name: oneclash
  start_url: https://oneclash.cc/freenode/
  article_exclusions: [category, page-]
# Blogger posts with Chinese dates and subscription links.
- kind: web
  resource_pattern: https://nodebuf\.com/files/public/[a-z0-9]+/preview
  name: cfmem
  start_url: https://www.cfmem.com/
  article_exclusions: [category, page-]
# Dated articles with direct V2Ray resources.
- kind: web
  resource_pattern: https://jichangx\.com/nodes/v2ray-\d{8}-\d+
  name: jichangx
  start_url: https://jichangx.com/free-subscription/
  article_exclusions: [category, page-]
# Dated articles with SSR, V2Ray, and Clash resources.
- kind: web
  resource_pattern: https?://starcorenode\.cczzuu\.top/node/\d{8}(?:\.txt|\.yaml)
  name: clashstair
  start_url: https://clashstair.com/category/freenode/
  article_exclusions: [category, page-]
# Blog with dates in title and URL, with subscription resources.
- kind: web
  resource_pattern: https://free\.datiya\.com/uploads/\d{8}-[A-Za-z0-9_-]+\.(?:txt|yaml)
  name: datiya
  start_url: https://free.datiya.com/
  article_exclusions: [category, page-]
# Password-protected articles using YouTube password evidence.
- kind: password_page
  resource_pattern: https://hh\.yudou226\.top/\d{6}/\d{8}[a-z0-9]+\.[a-z]{3,4}
  name: yudou
  password_policy:
    max_candidates: 50
    sources:
    - type: subtitles
      limit: 5
    - type: description
      limit: 5
    - type: aabb
      limit: 20
    - type: abab
      limit: 20
  paste_policy:
    max_candidates: 51
    sources:
    - type: empty
      limit: 1
    - type: subtitles
      limit: 5
    - type: description
      limit: 5
    - type: aabb
      limit: 20
    - type: abab
      limit: 20
  start_url: https://www.yudou789.top/category/jiedian/
  article_exclusions: [category, page-]
# YouTube descriptions linking to Google Drive archives.
- kind: youtube_resources
  name: fxrj
  password_policy:
    max_candidates: 51
    sources:
    - type: empty
      limit: 1
    - type: subtitles
      limit: 5
    - type: description
      limit: 5
    - type: aabb
      limit: 20
    - type: abab
      limit: 20
  start_url: https://www.youtube.com/@fxrj/videos/
# YouTube password evidence and paste-hosted resources.
- kind: youtube_resources
  name: zyfxs
  password_policy:
    max_candidates: 51
    sources:
    - type: empty
      limit: 1
    - type: subtitles
      limit: 5
    - type: description
      limit: 5
    - type: aabb
      limit: 20
    - type: abab
      limit: 20
  start_url: https://www.youtube.com/@ZYFXS/videos/
