discovery:
  source_concurrency: 2
  article_limit: 3
  request_timeout_seconds: 30
  proxy_url: null
  artifact_limit_per_source: 12
  byte_limit_per_source: 16777216
  byte_limit_per_run: 67108864
openrouter:
  request_limit_per_run: 30
  request_limit_per_source: 3
  request_timeout_seconds: 20
publication:
  stale_after_hours: 24
  expires_after_hours: 48
  node_limit: 500
repository:
  owner: nostalume
  name: FreeNodes
audit_sources:
