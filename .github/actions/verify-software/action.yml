name: Verify software
description: Run the canonical locked Python verification sequence

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "0.12.0"
        enable-cache: true

    - name: Install locked project
      shell: bash
      run: |
        uv python install 3.12
        uv sync --locked --extra youtube

    - name: Verify YouTube adapter dependency
      shell: bash
      run: uv run --locked --extra youtube python -m yt_dlp --version

    - name: Check formatting
      shell: bash
      run: uv run --locked ruff format --check .

    - name: Lint
      shell: bash
      run: uv run --locked ruff check .

    - name: Type check
      shell: bash
      run: uv run --locked ty check

    - name: Test
      shell: bash
      run: uv run --locked pytest -q
