name: Publish verified profiles

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: freenodes-publication
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
      receipt_sha: ${{ steps.stage.outputs.receipt_sha }}
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          persist-credentials: false

      - name: Record publication base
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify software
        uses: ./.github/actions/verify-software

      - name: Install browser
        run: uv run playwright install --with-deps chromium

      - name: Prepare verified profiles
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uv run --locked --extra youtube python main.py

      - name: Report preparation
        run: uv run --locked python main.py --report-publication >> "$GITHUB_STEP_SUMMARY"

      - name: Stage receipt-owned publication
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          receipt_sha=$(uv run --locked python main.py --prepare-publication publication-payload)
          echo "receipt_sha=$receipt_sha" >> "$GITHUB_OUTPUT"

      - name: Upload accepted publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: accepted-publication-${{ github.run_id }}
          path: publication-payload/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

  commit:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published_sha: ${{ steps.publish.outputs.sha }}
    steps:
      - name: Checkout exact publication base
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}

      - name: Download accepted publication
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: accepted-publication-${{ github.run_id }}
          path: publication-payload

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Admit and publish exact receipt paths
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          uv run --python 3.12 --locked python main.py \
            --apply-publication publication-payload \
            --receipt-sha "${{ needs.prepare.outputs.receipt_sha }}" \
            --pathspec-output .git/freenodes-publication-paths
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f --pathspec-from-file=.git/freenodes-publication-paths-managed
          git rm --cached --ignore-unmatch \
            --pathspec-from-file=.git/freenodes-publication-paths-removed
          if git diff --cached --quiet; then
            echo "No accepted profile changes"
          else
            git commit -m "auto: publish verified profiles"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report publication
        if: always()
        shell: bash
        env:
          PUBLISHED_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          {
            echo "## Publication commit"
            echo "- Outcome: ${{ steps.publish.outcome }}"
            if test -n "$PUBLISHED_SHA"; then
              printf '%s\n' "- Revision: \`$PUBLISHED_SHA\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  observe:
    needs: commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout published revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.commit.outputs.published_sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Observe public import entries
        run: uv run --python 3.12 --locked python main.py --verify-public
