[project]
name = "FreeNodes"
version = "0.1.0"
description = "Bounded proxy subscription discovery and publication"
requires-python = ">=3.12"
dependencies = [
    "crawl4ai>=0.5.0",
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.13,<3",
    "playwright>=1.62.0",
    "pydantic-extra-types>=2.10,<3",
    "pycountry>=24.6.1",
]

[project.optional-dependencies]
youtube = ["yt-dlp>=2026.8.19"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.5",
    "ty>=0.0.75",
]

[tool.uv]
default-groups = ["dev"]
package = false

[tool.ruff]
target-version = "py312"
include = ["main.py", "freenodes/**/*.py", "tests/**/*.py"]
extend-exclude = [".agents", ".cache", ".venv", "nodes"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "PERF",
    "C90",
    "RUF005",
    "RUF043",
    "RUF059",
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ty.src]
include = ["freenodes", "main.py"]
