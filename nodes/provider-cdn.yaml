mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: true
profile:
  store-selected: true
geodata-mode: true
geodata-loader: memconservative
geo-auto-update: true
geo-update-interval: 24
proxy-groups:
- name: 🚀 Auto
  type: url-test
  use:
  - cfmem
  - clashmeta
  - clashnode
  - clashstair
  - datiya
  - freeclashnode
  - jichangx
  - yudou
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 150
  lazy: true
  timeout: 5000
  expected-status: 204
- name: 🌍 Proxy
  type: select
  proxies:
  - 🚀 Auto
  - DIRECT
  use:
  - cfmem
  - clashmeta
  - clashnode
  - clashstair
  - datiya
  - freeclashnode
  - jichangx
  - yudou
- name: 🇨🇳 Mainland China
  type: select
  proxies:
  - DIRECT
  - 🌍 Proxy
- name: 🤖 AI
  type: select
  proxies:
  - 🌍 Proxy
  - DIRECT
- name: 🎬 Media
  type: select
  proxies:
  - 🌍 Proxy
  - DIRECT
- name: 💬 Messaging
  type: select
  proxies:
  - 🌍 Proxy
  - DIRECT
rules:
- GEOSITE,private,DIRECT
- GEOIP,private,DIRECT,no-resolve
- GEOSITE,category-ai-!cn,🤖 AI
- GEOSITE,youtube,🎬 Media
- GEOSITE,netflix,🎬 Media
- GEOSITE,telegram,💬 Messaging
- GEOSITE,cn,🇨🇳 Mainland China
- GEOIP,CN,🇨🇳 Mainland China,no-resolve
- MATCH,🌍 Proxy
proxy-providers:
  cfmem:
    type: http
    url: https://cdn.jsdelivr.net/gh/nostalume/FreeNodes/nodes/cfmem.yaml
    path: ./proxy_providers/cfmem.yaml
    interval: 3600
  clashmeta:
    type: http
    url: https://cdn.jsdelivr.net/gh/nostalume/FreeNodes/nodes/clashmeta.yaml
    path: ./proxy_providers/clashmeta.yaml
    interval: 3600
  clashnode:
    type: http
    url: https://cdn.jsdelivr.net/gh/nostalume/FreeNodes/nodes/clashnode.yaml
    path: ./proxy_providers/clashnode.yaml
    interval: 3600
  clashstair:
    type: http
    url: https://cdn.jsdelivr.net/gh/nostalume/FreeNodes/nodes/clashstair.yaml
    path: ./proxy_providers/clashstair.yaml
    interval: 3600
  datiya:
    type: http
    url: https://cdn.jsdelivr.net/gh/nostalume/FreeNodes/nodes/datiya.yaml
    path: ./proxy_providers/datiya.yaml
    interval: 3600
  freeclashnode:
    type: http
    url: https://cdn.jsdelivr.net/gh/nostalume/FreeNodes/nodes/freeclashnode.yaml
    path: ./proxy_providers/freeclashnode.yaml
    interval: 3600
  jichangx:
    type: http
    url: https://cdn.jsdelivr.net/gh/nostalume/FreeNodes/nodes/jichangx.yaml
    path: ./proxy_providers/jichangx.yaml
    interval: 3600
  yudou:
    type: http
    url: https://cdn.jsdelivr.net/gh/nostalume/FreeNodes/nodes/yudou.yaml
    path: ./proxy_providers/yudou.yaml
    interval: 3600
