mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: true
profile:
  store-selected: true
geodata-mode: true
geodata-loader: memconservative
geo-auto-update: true
geo-update-interval: 24
proxy-groups:
- name: 🚀 Auto
  type: url-test
  use:
  - au1rxx-clash
  - au1rxx-v2ray
  - cfmem
  - clashmeta
  - jichangx
  - kooker
  - radikal
  - shaoyouvip
  - ts-sf-clash
  - ts-sf-v2ray
  - wzmwayne
  - yudou
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 150
  lazy: true
  timeout: 5000
  expected-status: 204
- name: 🌍 Proxy
  type: select
  proxies:
  - 🚀 Auto
  - DIRECT
  use:
  - au1rxx-clash
  - au1rxx-v2ray
  - cfmem
  - clashmeta
  - jichangx
  - kooker
  - radikal
  - shaoyouvip
  - ts-sf-clash
  - ts-sf-v2ray
  - wzmwayne
  - yudou
- name: 🇨🇳 Mainland China
  type: select
  proxies:
  - DIRECT
  - 🌍 Proxy
- name: 🤖 AI
  type: select
  proxies:
  - 🌍 Proxy
  - DIRECT
- name: 🎬 Media
  type: select
  proxies:
  - 🌍 Proxy
  - DIRECT
- name: 💬 Messaging
  type: select
  proxies:
  - 🌍 Proxy
  - DIRECT
rules:
- GEOSITE,private,DIRECT
- GEOIP,private,DIRECT,no-resolve
- GEOSITE,category-ai-!cn,🤖 AI
- GEOSITE,youtube,🎬 Media
- GEOSITE,netflix,🎬 Media
- GEOSITE,telegram,💬 Messaging
- GEOSITE,cn,🇨🇳 Mainland China
- GEOIP,CN,🇨🇳 Mainland China,no-resolve
- MATCH,🌍 Proxy
proxy-providers:
  au1rxx-clash:
    type: http
    url: https://cdn.jsdelivr.net/gh/nostalume/FreeNodes/nodes/au1rxx-clash.yaml
    path: ./proxy_providers/au1rxx-clash.yaml
    interval: 3600
  au1rxx-v2ray:
    type: http
    url: https://cdn.jsdelivr.net/gh/nostalume/FreeNodes/nodes/au1rxx-v2ray.yaml
    path: ./proxy_providers/au1rxx-v2ray.yaml
    interval: 3600
  cfmem:
    type: http
    url: https://cdn.jsdelivr.net/gh/nostalume/FreeNodes/nodes/cfmem.yaml
    path: ./proxy_providers/cfmem.yaml
