mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: true
proxy-providers:
  cfmem:
    type: http
    url: https://cdn.jsdelivr.net/gh/nostalume/FreeNodes/nodes/cfmem.yaml
    path: ./proxy_providers/cfmem.yaml
    interval: 3600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      lazy: true
      expected-status: 204
  freeclashnode:
    type: http
    url: https://cdn.jsdelivr.net/gh/nostalume/FreeNodes/nodes/freeclashnode.yaml
    path: ./proxy_providers/freeclashnode.yaml
    interval: 3600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      lazy: true
      expected-status: 204
proxy-groups:
- name: 🚀 自动选择
  type: url-test
  use:
  - cfmem
  - freeclashnode
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
- name: 🌍 手动选择
  type: select
  proxies:
  - 🚀 自动选择
  - DIRECT
  use:
  - cfmem
  - freeclashnode
rules:
- MATCH,🌍 手动选择
