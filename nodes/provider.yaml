proxy-groups:
- name: 🚀 自动选择
  type: url-test
  use:
  - au1rxx-clash
  - au1rxx-v2ray
  - cfmem
  - clashmeta
  - datiya
  - freeclashnode
  - jichangx
  - kooker
  - radikal
  - shaoyouvip
  - ts-sf-clash
  - ts-sf-v2ray
  - wzmwayne
  - yudou
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
- name: 🌍 手动选择
  type: select
  proxies:
  - 🚀 自动选择
  - DIRECT
  use:
  - au1rxx-clash
  - au1rxx-v2ray
  - cfmem
  - clashmeta
  - datiya
  - freeclashnode
  - jichangx
  - kooker
